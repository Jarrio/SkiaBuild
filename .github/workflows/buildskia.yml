name: Build Skia Multi-Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated target names from config/targets.json, or "all"'
        required: false
        default: 'all'
        type: string

env:
  SKIA_BRANCH: chrome/m142

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Select targets
        id: select
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          matrix=$(jq -c --arg t "$TARGETS" '
            if $t == "all" then .
            else ($t | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $want
              | map(select(.name as $n | $want | index($n)))
            end' config/targets.json)
          if [ "$matrix" = "[]" ]; then
            echo "::error::No targets matched '$TARGETS'. Valid names: $(jq -r 'map(.name) | join(", ")' config/targets.json)"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

      - name: Build Skia
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_CPU: ${{ matrix.cpu }}
          EXTRA_ARGS: ${{ matrix.extra }}
        run: bash scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skia-${{ matrix.name }}
          path: |
            skia/out/Release/*.a
            skia/out/Release/*.lib
            skia/out/Release/icudtl.dat
            skia/out/Release/args.gn
